databases:
  - name: coverages-comments-db
    plan: free
    databaseName: coverages_comments
    user: coverages_comments_user

services:
  - type: web
    name: coverages-comments-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coverages-comments-db
          property: connectionString
